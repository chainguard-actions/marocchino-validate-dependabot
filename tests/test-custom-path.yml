name: Test custom path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid dependabot.yml at custom path
        run: |
          mkdir -p custom/config
          cat > custom/config/dependabot.yml << 'EOF'
          version: 2
          updates:
            - package-ecosystem: "github-actions"
              directory: "/"
              schedule:
                interval: "daily"
            - package-ecosystem: "pip"
              directory: "/"
              schedule:
                interval: "monthly"
          EOF

      - id: action
        uses: .
        with:
          path: custom/config/dependabot.yml
          success_message: 'All good!'
          failure_message: 'Errors found!'

      - name: Assert markdown output contains custom success message
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: markdown output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "All good!"; then
            echo "PASS: custom success message found in markdown"
          else
            echo "FAIL: expected custom success message 'All good!' not found in markdown"
            exit 1
          fi

      - name: Assert no errors on valid config
        env:
          ACTUAL: ${{ steps.action.outputs.errors }}
        run: |
          echo "actual errors: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no errors but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: no errors as expected"
