name: Test invalid dependabot config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid dependabot config (prefix too long)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github"
          cat > "$GITHUB_WORKSPACE/.github/dependabot.yml" <<'EOF'
          version: 2
          updates:
            - package-ecosystem: 'github-actions'
              commit-message:
                prefix: 'The prefix and the prefix-development options have a 50 character limit.'
            - package-ecosystem: 'github-actions'
              commit-message:
                prefix-development: 'The prefix and the prefix-development options have a 50 character limit.'
          EOF

      - id: action
        uses: .
        with:
          path: '.github/dependabot.yml'
        continue-on-error: true

      - name: Assert action failed (invalid config should fail)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for an invalid dependabot config"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid config"

      - name: Assert errors output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.errors }}
        run: |
          echo "actual errors: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected errors output to be non-empty for invalid config"
            exit 1
          fi
          echo "PASS: errors output is present as expected"

      - name: Assert markdown output contains failure message
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown output to be non-empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "dependabot errors"; then
            echo "PASS: markdown contains failure message"
          else
            echo "FAIL: expected markdown to contain failure message, got: $ACTUAL"
            exit 1
          fi
