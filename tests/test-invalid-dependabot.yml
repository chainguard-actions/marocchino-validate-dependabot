name: Test invalid dependabot.yml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid dependabot.yml (missing required fields)
        run: |
          mkdir -p .github
          cat > .github/dependabot.yml << 'EOF'
          version: 2
          updates:
            - package-ecosystem: "npm"
              directory: "/"
          EOF

      - id: action
        uses: .
        with:
          path: .github/dependabot.yml
          failure_message: "VALIDATION FAILED"
        continue-on-error: true

      - name: Assert action failed (invalid config should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid dependabot.yml but outcome was $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid config"

      - name: Assert errors output is set
        env:
          ACTUAL: ${{ steps.action.outputs.errors }}
        run: |
          echo "errors: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected errors output to be set"
            exit 1
          fi
          echo "PASS: errors output is set"

      - name: Assert markdown contains failure message
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "markdown: $ACTUAL"
          if [[ "$ACTUAL" != *"VALIDATION FAILED"* ]]; then
            echo "FAIL: expected markdown to contain 'VALIDATION FAILED'"
            exit 1
          fi
          echo "PASS: markdown contains failure message"
