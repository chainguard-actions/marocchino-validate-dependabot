name: Test invalid dependabot config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid dependabot.yml (missing required fields)
        run: |
          mkdir -p .github
          cat > .github/dependabot.yml << 'EOF'
          version: 2
          updates:
            - package-ecosystem: "not-a-valid-ecosystem"
              directory: "/"
              schedule:
                interval: "not-a-valid-interval"
          EOF

      - id: action
        uses: .
        with:
          path: .github/dependabot.yml
          failure_message: "Dependabot validation failed"
        continue-on-error: true

      - name: Assert action failed (invalid config should cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid dependabot config, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid config"

      - name: Assert errors output is present
        env:
          ACTUAL_ERRORS: ${{ steps.action.outputs.errors }}
        run: |
          echo "errors: $ACTUAL_ERRORS"
          if [ -z "$ACTUAL_ERRORS" ]; then
            echo "FAIL: expected errors output but got empty string"
            exit 1
          fi
          echo "PASS: errors output present as expected"
