name: Test custom success and failure messages
on:
  workflow_dispatch:
jobs:
  test-custom-success:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/dependabot-valid.yml
          success_message: "Custom success: all good!"
          failure_message: "Custom failure: something went wrong!"
      - name: Assert markdown output contains custom success message
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: markdown output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "Custom success: all good!"; then
            echo "PASS: custom success message found in markdown output"
          else
            echo "FAIL: expected custom success message not found in markdown output"
            exit 1
          fi

  test-custom-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/dependabot-invalid.yml
          success_message: "Custom success: all good!"
          failure_message: "Custom failure: something went wrong!"
        continue-on-error: true
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid config, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid config"
      - name: Assert markdown output contains custom failure message
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: markdown output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "Custom failure: something went wrong!"; then
            echo "PASS: custom failure message found in markdown output"
          else
            echo "FAIL: expected custom failure message not found in markdown output"
            exit 1
          fi
