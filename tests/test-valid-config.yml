name: Test valid dependabot config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/dependabot-valid.yml
      - name: Assert markdown output contains success message
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: markdown output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "dependabot config looks good"; then
            echo "PASS: success message found in markdown output"
          else
            echo "FAIL: expected success message not found in markdown output"
            exit 1
          fi
      - name: Assert errors output is empty
        env:
          ACTUAL: ${{ steps.action.outputs.errors }}
        run: |
          echo "actual errors: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no errors but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: no errors as expected"
