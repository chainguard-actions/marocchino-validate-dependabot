name: Test valid dependabot.yml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid dependabot.yml at default path
        run: |
          mkdir -p .github
          cat > .github/dependabot.yml << 'EOF'
          version: 2
          updates:
            - package-ecosystem: "npm"
              directory: "/"
              schedule:
                interval: "weekly"
          EOF

      - id: action
        uses: .
        with:
          path: .github/dependabot.yml

      - name: Assert no errors output
        env:
          ACTUAL: ${{ steps.action.outputs.errors }}
        run: |
          echo "errors: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no errors but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: no errors"

      - name: Assert markdown contains success message
        env:
          ACTUAL: ${{ steps.action.outputs.markdown }}
        run: |
          echo "markdown: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected markdown output but got empty string"
            exit 1
          fi
          echo "PASS: markdown output present"
