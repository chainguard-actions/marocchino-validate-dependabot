name: Test missing dependabot config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: .github/nonexistent-dependabot.yml
        continue-on-error: true

      - name: Assert action failed (missing file should fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for missing file, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
