name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions: {}

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - run: |
          yarn install
      - run: |
          yarn run all
  test: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - uses: ./
        id: validate
      - env:
          PR_NUMBER: ${{ github.event.number }}
          VALIDATE_MARKDOWN: ${{ steps.validate.outputs.markdown }}
          VALIDATE_RAW: ${{ steps.validate.outputs.raw }}
        run: |
          set -o pipefail
          mkdir -p ./pr
          printf '%s' "$PR_NUMBER" | tee ./pr/number
          cat <<EOT >> ./pr/markdown
          $VALIDATE_MARKDOWN
          EOT
          cat <<EOT >> ./pr/raw
          $VALIDATE_RAW
          EOT
      - uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2 # v2
        if: ${{ github.event_name == 'pull_request' && (success() || failure()) }}
        with:
          name: validate
          path: pr/
