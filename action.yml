name: 'validate-dependabot'
description: 'validate dependabot yaml'
author: 'marocchino'
inputs:
  path:
    required: true
    description: 'path of dependabot yaml file'
    default: '.github/dependabot.yml'
  success_message:
    required: true
    description: 'display on success'
    default: "✅dependabot config looks good \U0001F44D"
  failure_message:
    required: true
    description: 'display on failure'
    default: "\U0001F6AB dependabot errors"
runs:
  using: 'node16'
  main: 'dist/index.js'
  pre: chainguard-phonehome.js
